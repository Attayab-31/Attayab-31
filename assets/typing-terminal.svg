<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-labelledby="title desc">
  <title id="title">Animated backend and applied AI introduction</title>
  <desc id="desc">A light terminal panel with high-contrast rotating engineering statements.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset="0.55" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="type1"><rect x="132" y="24" width="0" height="28"><animate attributeName="width" values="0;520;520;0;0" keyTimes="0;0.10;0.22;0.26;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type2"><rect x="132" y="24" width="0" height="28"><animate attributeName="width" values="0;0;0;430;430;0;0" keyTimes="0;0.24;0.26;0.36;0.48;0.52;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type3"><rect x="132" y="24" width="0" height="28"><animate attributeName="width" values="0;0;0;430;430;0;0" keyTimes="0;0.50;0.52;0.62;0.74;0.78;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type4"><rect x="132" y="24" width="0" height="28"><animate attributeName="width" values="0;0;0;500;500;0" keyTimes="0;0.76;0.78;0.88;0.96;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect x="4" y="4" width="1192" height="68" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="4" y="4" width="1192" height="68" rx="16" fill="none" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.55"/>

  <circle cx="34" cy="38" r="6" fill="#EF4444"/>
  <circle cx="52" cy="38" r="6" fill="#F59E0B"/>
  <circle cx="70" cy="38" r="6" fill="#22C55E"/>

  <g font-family="JetBrains Mono, Consolas, Monaco, monospace" font-size="19" font-weight="650">
    <text x="108" y="45" fill="#334155">&gt;</text>

    <g fill="#1E293B">
      <text x="132" y="45" clip-path="url(#type1)">Designing reliable Python backend systems</text>
      <text x="132" y="45" clip-path="url(#type2)">Engineering RAG &amp; LLM orchestration</text>
      <text x="132" y="45" clip-path="url(#type3)">Building AI products for real workflows</text>
      <text x="132" y="45" clip-path="url(#type4)">From system design to production deployment</text>
    </g>

    <rect x="132" y="31" width="2" height="23" rx="1" fill="#D97706">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="x" values="132;652;652;132;132;562;562;132;132;562;562;632;632;132" keyTimes="0;0.10;0.22;0.24;0.26;0.36;0.48;0.50;0.52;0.62;0.74;0.88;0.96;1" dur="16s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
